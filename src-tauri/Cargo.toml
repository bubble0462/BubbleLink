[package]
name = "bubblelink-studio"
version = "0.9.1"
edition = "2021"
description = "BubbleLink 三模烧录器工作站上位机"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 16
